  <style>
    /* Mobile Nav */
    .mobile-nav a {
      font-size: 13px !important;
      letter-spacing: 0.2em !important;
      font-weight: 300 !important;
      text-transform: uppercase !important;
    }
    .mobile-nav a.active {
      font-weight: 500 !important;
    }

    /* Hamburger */
    #hamburger-fixed {
      display: none;
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 99999;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    #hamburger-fixed span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: #111;
      transition: all 0.3s ease;
      transform-origin: center;
    }
    #hamburger-fixed.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #hamburger-fixed.open span:nth-child(2) { opacity: 0; }
    #hamburger-fixed.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-nav { z-index: 9000 !important; }

    @media (max-width: 768px) {
      #hamburger-fixed { display: flex; }
      .hamburger { display: none !important; }

      /* Touch-Zustand: Video spielt in Farbe, Titel ausgeblendet */
      .project.touch-active video {
        filter: grayscale(0%) brightness(100%);
        transform: scale(1.03);
      }
      .project.touch-active .project-title {
        opacity: 0;
      }
    }
  </style>
  <script>try{if(localStorage.getItem('nicisinger-cookie-consent')==='accepted'){var _l=document.createElement('link');_l.rel='stylesheet';_l.href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap';document.head.appendChild(_l);}}catch(e){}</script>

<section class="projects">

</main>

<script>
const buttons = document.querySelectorAll('.categories button[data-filter]');
const catToggle = document.getElementById('catToggle');
const catSub = document.getElementById('catSub');
if (catToggle) catToggle.addEventListener('click', function() {
  catToggle.classList.toggle('open'); catSub.classList.toggle('open');
});
const projects = document.querySelectorAll('.project');

// Kategorie-Navigation
buttons.forEach(button => {
  button.addEventListener('click', () => {
    const filter = button.getAttribute('data-filter');

    // 👉 Weiterleitungen zu Detailseiten
    if (filter === 'events') {
      window.location.href = "events.html";
      return;
    }

    if (filter === 'brands') {
      window.location.href = "brands.html";
      return;
    }

    if (filter === 'retreats') {
      window.location.href = "retreats.html";
      return;
    }

    if (filter === 'weddings') {
      window.location.href = "weddings.html";
      return;
    }

    if (filter === 'outdoor') {
      window.location.href = "outdoor.html";
      return;
    }

    if (filter === 'drohne') {
  window.location.href = "drohne.html";
  return;
}

    // 👉 Nur "Alle" nutzt noch den Filter
    buttons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    projects.forEach(project => {
      project.classList.remove('hide');
    });
  });
});

// Hover-Video abspielen (Desktop)
projects.forEach(projectDiv => {
  const video = projectDiv.querySelector('video');
  projectDiv.addEventListener('mouseenter', () => video.play());
  projectDiv.addEventListener('mouseleave', () => {
    video.pause();
    video.currentTime = 0;
  });
});

// Touch-Video abspielen (Mobile) – Tap zum Starten/Stoppen
if ('ontouchstart' in window) {
  let activeProject = null;

  projects.forEach(projectDiv => {
    const video = projectDiv.querySelector('video');

    // Erstes Frame als Thumbnail anzeigen
    video.play().then(() => {
      video.pause();
      video.currentTime = 0;
    }).catch(() => {});

    projectDiv.addEventListener('touchstart', () => {
      if (activeProject && activeProject !== projectDiv) {
        // Anderes aktives Video stoppen
        const prevVideo = activeProject.querySelector('video');
        prevVideo.pause();
        prevVideo.currentTime = 0;
        activeProject.classList.remove('touch-active');
        activeProject = null;
      }

      if (projectDiv.classList.contains('touch-active')) {
        // Läuft bereits – stoppen
        video.pause();
        video.currentTime = 0;
        projectDiv.classList.remove('touch-active');
        activeProject = null;
      } else {
        // Starten
        projectDiv.classList.add('touch-active');
        video.play();
        activeProject = projectDiv;
      }
    }, { passive: true });
  });
}
</script>

<script>
  const header = document.querySelector("header");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 10) {
      header.classList.add("scrolled");
    } else {
      header.classList.remove("scrolled");
    }
  });
</script>

<script>
  // Hamburger Menü
  (function() {
    var hamburger = document.getElementById('hamburger-fixed');
    var mobileNav = document.getElementById('mobileNav');
    if (!hamburger || !mobileNav) return;
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      mobileNav.classList.toggle('open');

    });
    mobileNav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');

      });
    });
  })();
</script>

<script>
const fadeElements = document.querySelectorAll('.fade-in, .fade-in-section');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      // observer.unobserve(entry.target); // Optional: animiere jedes Mal, wenn sichtbar
    }
  });
}, {
  threshold: 0.2
});

fadeElements.forEach(el => observer.observe(el));

</script>
