<!DOCTYPE html>

<head>

  <meta name="description" content="Portfolio von Nici Singer, Videografin aus Köln. Branding, Events, Weddings und Outdoor – nationale und internationale Projekte.">
  <meta name="keywords" content="Videografin Köln, Branding Video, Event Videografie, Hochzeiten Video, Travel Video, internationale Videografin">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Mobile Nav */
    .mobile-nav a {
      font-size: 13px !important;
      letter-spacing: 0.2em !important;
      font-weight: 300 !important;
      text-transform: uppercase !important;
    }
    .mobile-nav a.active {
      font-weight: 500 !important;
    }

    /* Hamburger */
    #hamburger-fixed {
      display: none;
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 99999;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    #hamburger-fixed span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: #111;
      transition: all 0.3s ease;
      transform-origin: center;
    }
    #hamburger-fixed.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #hamburger-fixed.open span:nth-child(2) { opacity: 0; }
    #hamburger-fixed.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-nav { z-index: 9000 !important; }

    @media (max-width: 768px) {
      #hamburger-fixed { display: flex; }
      .hamburger { display: none !important; }

      /* Touch-Zustand: Video spielt in Farbe, Titel ausgeblendet */
      .project.touch-active video {
        filter: grayscale(0%) brightness(100%);
        transform: scale(1.03);
      }
      .project.touch-active .project-title {
        opacity: 0;
      }
    }
  </style>
</head>

<main>

  <nav class="categories">
    <button class="active" data-filter="all">Alle</button>
    <button data-filter="brands">Brands</button>
    <button data-filter="events">Events</button>
    <button data-filter="retreats">Retreats</button>
    <button data-filter="weddings">Weddings</button>
    <button data-filter="outdoor">Outdoor</button>
    <button data-filter="drohne" onclick="window.location.href='drohne.html'">Drohne</button>
  </nav>


<section class="projects">

  <a href="brands.html" class="project-link">
    <div class="project" data-category="brands">
      <video src="assets/video-brands.mp4" muted loop playsinline></video>
      <div class="project-title">Brands</div>
    </div>
  </a>

  <a href="events.html" class="project-link">
    <div class="project" data-category="events">
      <video src="assets/video-events.mp4" muted loop playsinline></video>
      <div class="project-title">Events</div>
    </div>
  </a>

  <a href="retreats.html" class="project-link">
    <div class="project" data-category="retreats">
      <video src="assets/video-retreats.mp4" muted loop playsinline></video>
      <div class="project-title">Retreats</div>
    </div>
  </a>

  <a href="weddings.html" class="project-link">
    <div class="project" data-category="weddings">
      <video src="assets/video-weddings.mp4" muted loop playsinline></video>
      <div class="project-title">Weddings</div>
    </div>

  <a href="outdoor.html" class="project-link">
    <div class="project" data-category="outdoor">
      <video src="assets/video-outdoor.mp4" muted loop playsinline></video>
      <div class="project-title">Outdoor</div>
    </div>
  </a>

  <a href="drohne.html" class="project-link">
  <div class="project" data-category="drohne">
    <video src="assets/video-drohne.mp4" muted loop playsinline></video>
    <div class="project-title">Drohne</div>
  </div>
</a>

</section>

</main>

<script>
const buttons = document.querySelectorAll('.categories button');
const projects = document.querySelectorAll('.project');

// Kategorie-Navigation
buttons.forEach(button => {
  button.addEventListener('click', () => {
    const filter = button.getAttribute('data-filter');

    // 👉 Weiterleitungen zu Detailseiten
    if (filter === 'events') {
      window.location.href = "events.html";
      return;
    }

    if (filter === 'brands') {
      window.location.href = "brands.html";
      return;
    }

    if (filter === 'retreats') {
      window.location.href = "retreats.html";
      return;
    }

    if (filter === 'weddings') {
      window.location.href = "weddings.html";
      return;
    }

    if (filter === 'outdoor') {
      window.location.href = "outdoor.html";
      return;
    }

    if (filter === 'drohne') {
  window.location.href = "drohne.html";
  return;
}

    // 👉 Nur "Alle" nutzt noch den Filter
    buttons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    projects.forEach(project => {
      project.classList.remove('hide');
    });
  });
});

// Hover-Video abspielen (Desktop)
projects.forEach(projectDiv => {
  const video = projectDiv.querySelector('video');
  projectDiv.addEventListener('mouseenter', () => video.play());
  projectDiv.addEventListener('mouseleave', () => {
    video.pause();
    video.currentTime = 0;
  });
});

// Touch-Video abspielen (Mobile) – wie mouseenter/mouseleave
if ('ontouchstart' in window) {
  projects.forEach(projectDiv => {
    const video = projectDiv.querySelector('video');

    projectDiv.addEventListener('touchstart', () => {
      projectDiv.classList.add('touch-active');
      video.play();
    }, { passive: true });

    projectDiv.addEventListener('touchend', () => {
      projectDiv.classList.remove('touch-active');
      video.pause();
      video.currentTime = 0;
    });

    projectDiv.addEventListener('touchcancel', () => {
      projectDiv.classList.remove('touch-active');
      video.pause();
      video.currentTime = 0;
    });
  });
}
</script>

<script>
  const header = document.querySelector("header");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 10) {
      header.classList.add("scrolled");
    } else {
      header.classList.remove("scrolled");
    }
  });
</script>

<script>
  // Hamburger Menü
  (function() {
    var hamburger = document.getElementById('hamburger-fixed');
    var mobileNav = document.getElementById('mobileNav');
    if (!hamburger || !mobileNav) return;
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('open');
      mobileNav.classList.toggle('open');
      document.body.style.overflow = mobileNav.classList.contains('open') ? 'hidden' : '';
    });
    mobileNav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  })();
</script>

<script>
const fadeElements = document.querySelectorAll('.fade-in, .fade-in-section');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      // observer.unobserve(entry.target); // Optional: animiere jedes Mal, wenn sichtbar
    }
  });
}, {
  threshold: 0.2
});

fadeElements.forEach(el => observer.observe(el));

</script>
